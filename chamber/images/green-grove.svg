<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Green Grove</title>
  <desc id="desc">Abstract green landscape logo with layered mountains and a circular hill.</desc>
  <rect width="800" height="600" fill="#efefef"/>

  <g transform="translate(0,0)">
    <!-- Large circular hill / leaf-like background -->
    <path d="M 390 120
             A 220 220 0 0 1 620 470
             L 620 600
             L 200 600
             L 200 470
             A 220 220 0 0 1 390 120 Z"
          fill="#8bcf4a"/>

    <!-- Front / lower mountain -->
    <polygon points="200,600 335,335 470,600" fill="#6fbf53"/>

    <!-- Center mountain -->
    <polygon points="300,600 455,250 610,600" fill="#52a14d"/>

    <!-- Rear mountain -->
    <polygon points="395,600 565,175 735,600" fill="#3e8e44"/>
  </g>
</svg>
